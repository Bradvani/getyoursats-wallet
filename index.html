<!DOCTYPE html>
<html lang="en">

<head>
  <!-- First element in <head>: a CSP meta only governs resources the parser
       reaches after it. Carries the policy on the surfaces that have no
       response headers of our own (iOS capacitor://localhost); on the hosted
       PWA it coexists with the vercel.json header, which adds the
       header-only directives (frame-ancestors, upgrade-insecure-requests).
       Keep the shared directives byte-identical with vercel.json and
       glow-app's capacitor.config.ts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="application-name" content="GetYourSats" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="GetYourSats" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- The early bootstrap applies the saved appearance before first paint. -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0B0B0B" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0B0B0B" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B0B" />
  <meta name="msapplication-TileColor" content="#0a0a0f" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Description -->
  <meta name="description" content="GetYourSats is a Bitcoin wallet with Lightning payments." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:title" content="GetYourSats · Bitcoin wallet" />
  <meta property="og:description" content="GetYourSats is a Bitcoin wallet with Lightning payments." />
  <meta property="og:image" content="/brand/app-icon-1024.png" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GetYourSats · Bitcoin wallet" />
  <meta name="twitter:description" content="GetYourSats is a Bitcoin wallet with Lightning payments." />
  <meta name="twitter:image" content="/brand/app-icon-1024.png" />
  
  <!-- Icons -->
  <!-- Prefer the genuine full-colour GetYourSats wordmark over the old
       monochrome S. The version query refreshes browser favicon caches. -->
  <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png?v=4" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/wordmark-stacked-dark.svg?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/app-icon-180.png?v=4" />
  <!-- iOS standalone launch images. Without these iOS shows a blank
       scheme-colored frame (a black flash on this app) before first
       paint; background_color in the manifest is ignored. Canvas is
       #050505 (spark-dark) so startup image, #splash spinner page,
       and the welcome page all share one canvas color; logo in the same
       144pt box as .splash-logo so the handoff does not resize it. iOS
       requires an exact device-size + DPR + orientation match per image
       (portrait-only set; the app is portrait-designed). Regenerate with
       scripts/generate-apple-splash.js. -->

  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json?v=4" />

  <title>GetYourSats · Bitcoin wallet</title>

  <!-- Fonts (Plus Jakarta Sans for UI, JetBrains Mono for numbers) are
       self-hosted and bundled via @fontsource, imported from src/index.css.
       They used to load from fonts.googleapis.com here, which put a
       third-party network round trip on the first-paint path of a native
       app and broke first paint offline. -->

  <script src="/theme-bootstrap.js"></script>

  <!-- Initial loading styles -->
  <style>
    /* Prevent pull-to-refresh on iOS */
    html, body {
      overscroll-behavior-y: none;
      background: #0B0B0B; /* spark-dark: same canvas as the welcome page */
    }

    /* Initial splash screen. Fade-out is driven by the Web Animations
       API in main.tsx's hideSplash() — not a CSS class toggle — because
       `transitionend` proved unreliable on Android WebView and left the
       splash visibly racing the biometric prompt during unlock. */
    #splash {
      position: fixed;
      inset: 0;
      background: #0B0B0B;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    /* GetYourSats logo, not a spinner: this page is the continuation of the
       native splash (same canvas), so the launch reads as one splash
       until the wallet is ready. Sign-of-life for the long tail comes
       from the wallet page itself once it reveals.

       144px, not a vw fraction: the native splash marks are absolute
       (Android 12+ specs its splash icon in dp, and the iOS launch
       screen is pinned to the same box), so a viewport-relative size
       here can only agree with them at one screen width and visibly
       resizes the mark at the handoff everywhere else. Every logo on
       the launch path is this same 144 box: LockScreen, PinEntry,
       UnlockPage, UnlockingPage, HomePage. */
    :root[data-gys-theme="orange"],
    :root[data-gys-theme="orange"] body,
    :root[data-gys-theme="orange"] #splash { background: #FAF7F1; }
    .splash-logo--light { display: none; }
    :root[data-gys-theme="orange"] .splash-logo--dark { display: none; }
    :root[data-gys-theme="orange"] .splash-logo--light { display: block; }
    .splash-logo {
      width: 144px;
      height: 144px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <!-- Splash screen shown during initial load -->
  <div id="splash">
    <img class="splash-logo splash-logo--dark" src="/brand/wordmark-stacked-dark.svg" alt="GetYourSats" />
    <img class="splash-logo splash-logo--light" src="/brand/wordmark-stacked-light.svg" alt="GetYourSats" />
  </div>
  
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  
  <script src="/sw-register.js" defer></script>
</body>

</html>
