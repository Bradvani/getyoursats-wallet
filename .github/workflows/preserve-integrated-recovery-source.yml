name: Preserve integrated recovery source
on:
  push:
    branches: [build/integrated-recovery-source-20261028]
    paths: [.github/workflows/preserve-integrated-recovery-source.yml]
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/build/integrated-recovery-source-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9f3f04443e4b948d7b3a76519f3f2eeb48fa18f3
          persist-credentials: false
      - name: Verify immutable source transfer
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request
          url='https://sb-ixqgq64g2tac.vercel.run/source-6449eeb6fe3386766cb45af7cecd6c5def7163ffce48c70719805d137efc275a.patch'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  raise RuntimeError('Source redirects are not permitted')
          opener=urllib.request.build_opener(NoRedirect())
          with opener.open(url,timeout=30) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise RuntimeError('Unexpected source response')
              data=response.read(53200)
          if len(data)!=53199 or hashlib.sha256(data).hexdigest()!='6449eeb6fe3386766cb45af7cecd6c5def7163ffce48c70719805d137efc275a':
              raise RuntimeError('Source patch integrity mismatch')
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-source'
          evidence.mkdir();patch=evidence/'candidate.patch';patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          if tree!='11e1276add584c149aae9b3f0f14ba5fdfcc85d3':
              raise RuntimeError('Reconstructed source tree mismatch')
          (evidence/'source.txt').write_text('base=9f3f04443e4b948d7b3a76519f3f2eeb48fa18f3\ntree='+tree+'\npatch_sha256=6449eeb6fe3386766cb45af7cecd6c5def7163ffce48c70719805d137efc275a\n')
          print('Verified source tree:',tree)
          PY
      - name: Upload immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          base='9f3f04443e4b948d7b3a76519f3f2eeb48fa18f3'
          expected='11e1276add584c149aae9b3f0f14ba5fdfcc85d3'
          def git(*args):
              return subprocess.check_output(['git',*args])
          if git('write-tree').decode().strip()!=expected:
              raise SystemExit('Candidate source changed')
          if git('diff','--cached','--name-only','--diff-filter=D',base).strip():
              raise SystemExit('Unexpected deletion')
          entries=[];receipts=[]
          for path in git('diff','--cached','--name-only','--diff-filter=ACMR',base).decode().splitlines():
              mode,sha,stage=git('ls-files','--stage','--',path).decode().split('\t')[0].split()
              if stage!='0':raise SystemExit('Unresolved source')
              data=git('cat-file','blob',sha)
              request=urllib.request.Request('https://api.github.com/repos/Bradvani/getyoursats-wallet/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  uploaded=json.load(response)
              if uploaded.get('sha')!=sha:raise SystemExit('Uploaded source bytes differ')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              receipts.append({'path':path,'sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
              print('Preserved:',path,sha)
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-source'
          (evidence/'tree-entries.json').write_text(json.dumps({'base':base,'baseTree':git('rev-parse',base+'^{tree}').decode().strip(),'expectedTree':expected,'treeElements':entries,'blobReceipts':receipts,'refUpdatesPerformed':False,'productionAuthorized':False},indent=2)+'\n')
          print('SOURCE_BLOBS_PRESERVED; no tree, commit or branch updates performed')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-recovery-source-11e1276
          path: ${{ runner.temp }}/recovery-source/
          if-no-files-found: error
          retention-days: 30
