name: Assemble Gate 1 candidate objects
on:
  push:
    branches: [build/gate1-assembly-20261028]
    paths: [.github/workflows/assemble-gate1-candidate.yml]
permissions:
  contents: write
concurrency:
  group: gate1-assembly-20261028
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/build/gate1-assembly-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e606e1f3e91c3b540458cf630fa28a6700c5728
          fetch-depth: 250
          persist-credentials: false
      - name: Reproduce the exact locally verified source tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5e606e1f3e91c3b540458cf630fa28a6700c5728'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/gate1-assembly-evidence"
          python3 scripts/security/gate1-assembly/assemble.py "$RUNNER_TEMP/gate1-candidate" > "$RUNNER_TEMP/gate1-assembly-evidence/assembly.txt"
          cat "$RUNNER_TEMP/gate1-assembly-evidence/assembly.txt"
      - name: Upload immutable source blobs only; do not create commits or change branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          root = Path(os.environ['RUNNER_TEMP']) / 'gate1-candidate'
          out = Path(os.environ['RUNNER_TEMP']) / 'gate1-assembly-evidence'
          os.chdir(root)
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = '35daca92718d78b384847b341bbe00d990796a3d'
          if git('rev-parse', 'HEAD^{tree}').decode().strip() != expected or git('status', '--porcelain'):
              raise SystemExit('Candidate source changed')
          base = '5cff021037ad9aa1a984bc33ed97bcc407e3b27e'
          inputs = [base, '37abc88bd113d6c519911fd6773dc74ce603282a', '98211bf90ec740c89091906230338097e81db237']
          def inventory(ref):
              result = {}
              for line in git('ls-tree', '-r', ref).decode().splitlines():
                  header, path = line.split('\t', 1)
                  mode, kind, sha = header.split()
                  if kind != 'blob':
                      raise SystemExit('Unexpected source object')
                  result[path] = (mode, sha)
              return result
          old = inventory(base)
          current = inventory('HEAD')
          known = {sha for ref in inputs for mode, sha in inventory(ref).values()}
          entries = []
          receipts = []
          for path, (mode, sha) in sorted(current.items()):
              if old.get(path) == (mode, sha):
                  continue
              if sha not in known:
                  data = git('cat-file', 'blob', sha)
                  body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
                  request = urllib.request.Request('https://api.github.com/repos/Bradvani/getyoursats-wallet/git/blobs', data=body, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  with urllib.request.urlopen(request, timeout=30) as response:
                      uploaded = json.load(response)
                  if uploaded.get('sha') != sha:
                      raise SystemExit('Uploaded source object differs')
                  known.add(sha)
                  receipts.append({'path': path, 'sha': sha, 'sha256': hashlib.sha256(data).hexdigest()})
                  print('Preserved source blob:', path, sha)
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          for path in sorted(set(old) - set(current)):
              entries.append({'path': path, 'mode': old[path][0], 'type': 'blob', 'sha': None})
          manifest = {'schema': 1, 'baseCommit': base, 'baseTree': git('rev-parse', base+'^{tree}').decode().strip(), 'expectedTree': expected, 'inputCommits': inputs, 'treeElements': entries, 'newBlobReceipts': receipts, 'productionAuthorized': False, 'refUpdatesPerformed': False}
          (out / 'tree-entries.json').write_text(json.dumps(manifest, indent=2)+'\n')
          patch = git('diff', '--binary', base, 'HEAD')
          (out / 'candidate-changes.patch').write_bytes(patch)
          (out / 'patch.sha256').write_text(hashlib.sha256(patch).hexdigest()+'  candidate-changes.patch\n')
          print('Expected final tree:', expected)
          print('Changed paths:', len(entries), 'New blob uploads:', len(receipts))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gate1-assembly-35daca92718d78b384847b341bbe00d990796a3d
          path: ${{ runner.temp }}/gate1-assembly-evidence/
          if-no-files-found: error
          retention-days: 30
