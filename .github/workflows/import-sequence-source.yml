name: Preserve verified transfer sequence revision
on:
  push:
    branches: ['feat/transfer-contours-v2-20261027']
    paths: ['.github/workflows/import-sequence-source.yml']
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'Bradvani/getyoursats-wallet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/transfer-contours-v2-20261027
          fetch-depth: 2
      - name: Verify exact patch and preserve application source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c5c1204dcaeb6cb3c7241e66b91a9863381ce7b3'
          curl --fail --silent --show-error --retry 2 --max-time 30 'https://sb-7dkddb1841ow.vercel.run/sequence-source.patch.gz' -o /tmp/sequence.patch.gz
          echo '897622f9b9d305e8aabe3d58bd647d33374d3036712bbf83b1f8873ee085627f  /tmp/sequence.patch.gz' | sha256sum --check
          gzip -dc /tmp/sequence.patch.gz > /tmp/sequence.patch
          echo '8dd5abac99bbeea848f2c94de2956cc3bd5f01573f0e1bfea5371fc64901c959  /tmp/sequence.patch' | sha256sum --check
          git apply --check /tmp/sequence.patch
          git apply --index /tmp/sequence.patch
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          cp .git/index /tmp/verify-index
          GIT_INDEX_FILE=/tmp/verify-index git update-index --force-remove .github/workflows/import-sequence-source.yml
          test "$(GIT_INDEX_FILE=/tmp/verify-index git write-tree)" = '3bbe23d8360ada76aa8cf831c0e6cf11e1afdf4f'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(payments): single evidence-bound sequence with percentage and Bitcoin glyph fill'
          git push origin HEAD:refs/heads/feat/transfer-contours-v2-20261027
