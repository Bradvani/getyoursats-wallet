name: Verify signed recovery wiring
# This historical integration's reviewed output is already in the candidate.
# Run manually so routine workflow edits cannot reapply and push older source.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr43-recovery-wiring
  cancel-in-progress: true
jobs:
  verify:
    name: verify-signed-recovery-wiring
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/release/browser-pwa-security-localization-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow reviewed integration
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-wiring
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/security/wire-signed-recovery.py');s=p.read_text().replace('if new in s and old not in s:return','if new in s:return');p.write_text(s)
          p=Path('src/security/signedRecoveryController.ts');s=p.read_text()
          s=s.replace("'feeLimitSats'|'transactions'>","'feeLimitSats'|'transactions'|'refund'>")
          if "'Source outpoint':r.refund.txid" not in s:
              s=s.replace("Action:action,Network:network,Destination:r.destination,","Action:action,Network:network,Destination:r.destination,\n   ...(r.refund?{'Source outpoint':r.refund.txid+':'+r.refund.vout}:{}),")
          s=s.replace("feeLimitSats,transactions:[]},epoch,'Authorize deposit refund'","feeLimitSats,transactions:[],refund:request},epoch,'Authorize deposit refund'")
          anchor="const intentHash=await journalDigest({network,request,amountSats,feeLimitSats});live(epoch);"
          replacement=anchor+"\n   if(Date.now()>=deadline)throw new Error('Refund preparation expired');"
          if replacement not in s:s=s.replace(anchor,replacement)
          p.write_text(s)
          PY
          python3 scripts/security/wire-signed-recovery.py
          git diff --check
      - run: npm ci --ignore-scripts
      - name: Validate all source, denial paths and recovery state machines
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run lint
          rc=0
          npx vitest run --reporter=json --outputFile=/tmp/recovery-wiring/tests.json || rc=$?
          node - <<'JS'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/recovery-wiring/tests.json','utf8'));
          console.log(JSON.stringify({total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests}));
          for(const suite of r.testResults||[])for(const t of suite.assertionResults||[])if(t.status==='failed')console.log('FAILED:',t.fullName,'\n',...(t.failureMessages||[]).map(m=>m.slice(0,4500)));
          JS
          test "$rc" = 0
          npm run test:security:wasm
          npm run build
          if VERCEL_ENV=production npx vite build >/tmp/recovery-wiring/interlock.log 2>&1; then exit 1; fi
          grep -q 'Browser wallet security release is not approved' /tmp/recovery-wiring/interlock.log
          git diff --full-index --binary > /tmp/recovery-wiring/source.patch
          git rev-parse HEAD > /tmp/recovery-wiring/base.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-wiring-${{ github.sha }}
          path: /tmp/recovery-wiring/
          retention-days: 14
  preserve:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/browser-pwa-security-localization-20261025
          fetch-depth: 100
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recovery-wiring-${{ github.sha }}
          path: /tmp/recovery-wiring
      - name: Preserve tested wiring without touching main or production
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$(cat /tmp/recovery-wiring/base.txt)" HEAD
          git apply --3way --index /tmp/recovery-wiring/source.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(security): wire signed recovery into gateway and require durable exit state'
          git push origin HEAD:refs/heads/release/browser-pwa-security-localization-20261025
          git rev-parse HEAD
