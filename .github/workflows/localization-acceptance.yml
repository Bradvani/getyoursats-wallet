name: Localization acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use the official HTTPS Ubuntu archive
        run: |
          set -euo pipefail
          sudo python3 -I -B - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          pattern = re.compile(r'https?://(?:azure\.)?archive\.ubuntu\.com/ubuntu(?=/|\s|$)')
          archive_sources = 0
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated, count = pattern.subn('https://archive.ubuntu.com/ubuntu', original)
              archive_sources += count
              if updated != original:
                  path.write_text(updated)
                  print(f'Updated the Ubuntu archive transport in {path}')
          if archive_sources == 0:
              raise SystemExit('No recognized Ubuntu archive was found; inspect the runner sources')
          PY
      - run: node scripts/build-public-locale-fonts.mjs
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test e2e/tests/localization-complete.spec.ts e2e/tests/getyoursats-privacy-locales.spec.ts --project ${{ matrix.browser }}
        env:
          VITE_BREEZ_API_KEY: ''
          VITE_SPARK_LOCAL_CONFIG: ''
          VITE_GETYOURSATS_PASSKEY_ORIGIN: ''
      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localization-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-artifacts/*.png
            test-results/**/*
          if-no-files-found: ignore
          retention-days: 7
