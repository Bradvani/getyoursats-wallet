name: Retain recovery integration verification
on:
  push:
    branches: [build/integrated-recovery-source-20261028]
    paths: [.github/workflows/retain-recovery-verification.yml]
permissions:
  contents: read
jobs:
  retain:
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/build/integrated-recovery-source-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify bounded evidence archive
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib,os,pathlib,urllib.request
          url='https://sb-ixqgq64g2tac.vercel.run/evidence-f02a0cd6ddad36ca38a8cdb3a818aee7faec4c7b893de53522e91dde8d725052.zip'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):raise RuntimeError('Evidence redirect refused')
          with urllib.request.build_opener(NoRedirect()).open(url,timeout=30) as response:
              if response.status!=200 or response.geturl()!=url:raise RuntimeError('Unexpected evidence response')
              data=response.read(188451)
          expected='f02a0cd6ddad36ca38a8cdb3a818aee7faec4c7b893de53522e91dde8d725052'
          if len(data)!=188450 or hashlib.sha256(data).hexdigest()!=expected:raise RuntimeError('Evidence integrity mismatch')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'local-regression-evidence';root.mkdir()
          (root/'GYS-Integration-91333c0-local-evidence.zip').write_bytes(data)
          (root/'SHA256.txt').write_text(expected+'  GYS-Integration-91333c0-local-evidence.zip\n')
          print('Local evidence preserved without execution. This is not a new test run or release approval.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-integration-local-evidence-f02a0cd
          path: ${{ runner.temp }}/local-regression-evidence/
          if-no-files-found: error
          retention-days: 30
