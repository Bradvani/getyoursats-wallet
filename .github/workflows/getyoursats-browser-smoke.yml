name: GetYourSats browser smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify safe setup, review changes and responsive wallet journeys
        run: npx playwright test e2e/tests/payment-locales.spec.ts e2e/tests/getyoursats-desktop-navigation.spec.ts e2e/tests/getyoursats-review.spec.ts e2e/tests/getyoursats-setup.spec.ts e2e/tests/getyoursats-landing.spec.ts e2e/tests/getyoursats-premium.spec.ts e2e/tests/getyoursats-orange-audit.spec.ts e2e/tests/getyoursats-scarcity-rulebook.spec.ts e2e/tests/getyoursats-contact-enquiries.spec.ts e2e/tests/getyoursats-site-experience.spec.ts --project chromium
        env:
          VITE_BREEZ_API_KEY: ''
          VITE_SPARK_LOCAL_CONFIG: ''
          VITE_GETYOURSATS_PASSKEY_ORIGIN: ''
      - name: Verify navigation and motion across browser engines
        run: npx playwright test e2e/tests/payment-locales.spec.ts e2e/tests/getyoursats-desktop-navigation.spec.ts --project firefox --project webkit
        env:
          VITE_BREEZ_API_KEY: ''
          VITE_SPARK_LOCAL_CONFIG: ''
          VITE_GETYOURSATS_PASSKEY_ORIGIN: ''
      - name: Upload commit-bound browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: getyoursats-chromium-${{ github.sha }}
          path: |
            test-artifacts/*.png
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
