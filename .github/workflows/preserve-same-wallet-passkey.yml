name: Preserve same-wallet passkey source
on:
  push:
    branches: [build/same-wallet-passkey-source-20261028]
    paths: [.github/workflows/preserve-same-wallet-passkey.yml]
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/build/same-wallet-passkey-source-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1de19e0af194176138be85aa5200f1c67715646b
          persist-credentials: false
      - name: Fetch and verify the exact public source patch
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request
          url = 'https://sb-3ncqgvj67w34.vercel.run/source-529c6a75696136322ec801efa9bb7e8bb20697a17791f270ecdeeb41c5b7b0bd.patch'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError('Source redirects are not permitted')
          opener = urllib.request.build_opener(NoRedirect())
          with opener.open(url, timeout=30) as response:
              if response.status != 200 or response.geturl() != url:
                  raise RuntimeError('Unexpected source response')
              data = response.read(167780)
          if len(data) != 167779 or hashlib.sha256(data).hexdigest() != '529c6a75696136322ec801efa9bb7e8bb20697a17791f270ecdeeb41c5b7b0bd':
              raise RuntimeError('Source patch integrity mismatch')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'protection-source'
          evidence.mkdir()
          patch = evidence / 'candidate.patch'
          patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          if tree != '6bdd52e1b5131490974b7a416096b61525736ebf':
              raise RuntimeError('Reconstructed tree does not match frozen source')
          (evidence/'source.txt').write_text('base=1de19e0af194176138be85aa5200f1c67715646b\ntree='+tree+'\npatch_sha256=529c6a75696136322ec801efa9bb7e8bb20697a17791f270ecdeeb41c5b7b0bd\n')
          print('Verified source tree:', tree)
          PY
      - name: Preserve immutable blobs and tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'https://api.github.com/repos/Bradvani/getyoursats-wallet'
          base = '1de19e0af194176138be85aa5200f1c67715646b'
          expected = '6bdd52e1b5131490974b7a416096b61525736ebf'
          def git(*args):
              return subprocess.check_output(['git',*args])
          def post(path, body):
              request = urllib.request.Request(repo+path, data=json.dumps(body).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('Candidate changed')
          changed = git('diff','--cached','--name-only','--diff-filter=ACMR',base).decode().splitlines()
          entries=[]
          receipts=[]
          for path in changed:
              header = git('ls-files','--stage','--',path).decode().split('\t')[0]
              mode, sha, stage = header.split()
              if stage != '0':
                  raise SystemExit('Unresolved candidate source')
              data=git('cat-file','blob',sha)
              result=post('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              if result.get('sha') != sha:
                  raise SystemExit('Uploaded blob does not match')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              receipts.append({'path':path,'sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
              print('Preserved:',path,sha)
          if git('diff','--cached','--name-only','--diff-filter=D',base).strip():
              raise SystemExit('Unexpected deletion in this candidate')
          tree=post('/git/trees',{'base_tree':git('rev-parse',base+'^{tree}').decode().strip(),'tree':entries})
          if tree.get('sha') != expected:
              raise SystemExit('Preserved tree mismatch')
          evidence=pathlib.Path(os.environ['RUNNER_TEMP'])/'protection-source'
          (evidence/'receipt.json').write_text(json.dumps({'base':base,'tree':expected,'patchSha256':'529c6a75696136322ec801efa9bb7e8bb20697a17791f270ecdeeb41c5b7b0bd','blobs':receipts,'refUpdatesPerformed':False,'productionAuthorized':False},indent=2)+'\n')
          print('PRESERVED_TREE='+expected)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: same-wallet-passkey-source-6bdd52e
          path: ${{ runner.temp }}/protection-source/
          if-no-files-found: error
          retention-days: 30
