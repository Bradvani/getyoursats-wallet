name: Preserve full history source
on:
  push:
    branches: [build/full-history-source-20261028]
    paths: [.github/workflows/preserve-full-history-source.yml]
permissions:
  contents: write
jobs:
  preserve:
    if: github.repository == 'Bradvani/getyoursats-wallet' && github.ref == 'refs/heads/build/full-history-source-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 91333c0d0f1a33bc9dceb91d4add1f6866ac435d
          persist-credentials: false
      - name: Verify the exact public source patch
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request
          url='https://sb-18ihmnigwxgx.vercel.run/source-d1d4dacd1a90f1dcc7f715e945bc83364f81dfd00cbf9a62d4391f07831abc9e.patch'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  raise RuntimeError('Source redirects are not permitted')
          with urllib.request.build_opener(NoRedirect()).open(url,timeout=30) as response:
              if response.status!=200 or response.geturl()!=url:
                  raise RuntimeError('Unexpected source response')
              data=response.read(37301)
          expected='d1d4dacd1a90f1dcc7f715e945bc83364f81dfd00cbf9a62d4391f07831abc9e'
          if len(data)!=37300 or hashlib.sha256(data).hexdigest()!=expected:
              raise RuntimeError('Source patch integrity mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'history-source';out.mkdir()
          patch=out/'candidate.patch';patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          if tree!='f987166cde8238b7d32d8ef86bed7fda4bf018db':
              raise RuntimeError('Reconstructed source tree differs')
          (out/'source.txt').write_text('base=91333c0d0f1a33bc9dceb91d4add1f6866ac435d\ntree='+tree+'\npatch_sha256='+expected+'\n')
          print('Verified source tree:',tree)
          PY
      - name: Preserve immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          def git(*args):
              return subprocess.check_output(['git',*args])
          expected='f987166cde8238b7d32d8ef86bed7fda4bf018db'
          base='91333c0d0f1a33bc9dceb91d4add1f6866ac435d'
          if git('write-tree').decode().strip()!=expected:
              raise SystemExit('Candidate changed')
          if git('diff','--cached','--name-only','--diff-filter=D',base).strip():
              raise SystemExit('Unexpected deletion')
          receipts=[];entries=[]
          for path in git('diff','--cached','--name-only','--diff-filter=ACMR',base).decode().splitlines():
              mode,sha,stage=git('ls-files','--stage','--',path).decode().split('\t')[0].split()
              if stage!='0':raise SystemExit('Unresolved source')
              data=git('cat-file','blob',sha)
              request=urllib.request.Request('https://api.github.com/repos/Bradvani/getyoursats-wallet/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              if result.get('sha')!=sha:raise SystemExit('Source blob mismatch')
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              receipts.append({'path':path,'sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
              print('Preserved:',path,sha)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'history-source'
          (out/'receipt.json').write_text(json.dumps({'base':base,'tree':expected,'entries':entries,'blobs':receipts,'refUpdatesPerformed':False,'productionAuthorized':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-history-source-f987166
          path: ${{ runner.temp }}/history-source/
          if-no-files-found: error
          retention-days: 30
