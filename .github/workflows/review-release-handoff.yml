name: Review tested source handoff
on:
  pull_request:
    paths:
      - '.github/workflows/review-release-handoff.yml'
permissions:
  contents: read
jobs:
  handoff:
    if: github.event.pull_request.number == 31 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch only the reviewed source patch and verify its exact digest
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --max-time 45 'https://sb-245ol9kwnaut.vercel.run/release.patch' -o /tmp/release.patch
          printf '%s  %s\n' '723ebae24a0ef0ec5c34940bdfb05c2d6b8b4843ff007f612a5f0afdb4a31595' '/tmp/release.patch' | sha256sum -c -
          git apply --numstat /tmp/release.patch | python3 -c 'import sys; paths=[line.rstrip().split("\t")[-1] for line in sys.stdin]; assert paths and all(p.startswith(("src/","e2e/","docs/review/")) or p=="scripts/review-security-inventory.mjs" for p in paths); assert all(".." not in p.split("/") for p in paths)'
          git apply --check /tmp/release.patch
          git apply --index /tmp/release.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'Apply tested review release source: trust, receiving, navigation and merchant record improvements'
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Publish source objects only to isolated review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/review-askpass <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token';;
            *Password*) printf '%s\n' "$GH_TOKEN";;
            *) exit 1;;
          esac
          SH
          chmod 700 /tmp/review-askpass
          GIT_ASKPASS=/tmp/review-askpass GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c core.hooksPath=/dev/null push origin HEAD:refs/heads/review/validated-source-20261025
          rm -f /tmp/review-askpass
