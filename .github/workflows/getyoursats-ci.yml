name: GetYourSats checks
on:
  push:
    branches: [main, 'getyoursats/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test tests/*.test.mjs
      - name: Install isolated Redis acceptance dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Verify cross-instance support quotas without external delivery
        run: node --test tests/contact-budget.integration.mjs
      - name: Verify notification authorization and retries with isolated Redis
        run: node --test tests/push-service.integration.mjs
      - name: Verify native GYS identity and atomic recipient bindings without funds
        run: node --test tests/native-lnurl-session.integration.mjs tests/gys-direct-directory.integration.mjs
      - run: npm run lint
