name: GetYourSats checks
on:
  push:
    branches: [main, 'getyoursats/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify complete source and generated artifact proof controls
        run: python3 -B tests/sdk-build-guards.test.py
      - name: Verify canonical installed package controls
        run: python3 -B tests/canonical-installed-sdk.test.py
      - name: Verify the canonical package and installed SDK boundaries
        run: npm run test:security:wasm
      - name: Verify production deployment remains blocked by the security interlock
        run: |
          set -euo pipefail
          interlock_log="$RUNNER_TEMP/security-production-interlock.log"
          expected_error='Error: Browser wallet security release is not approved. Resolve the blockers in docs/security-review/browser-continuation-release.md before production deployment.'
          if VERCEL_ENV=production NO_COLOR=1 npx vite build > "$interlock_log" 2>&1; then
            cat "$interlock_log"
            exit 1
          fi
          cat "$interlock_log"
          if ! grep -Fqx -- "$expected_error" "$interlock_log"; then
            exit 1
          fi
      - run: npm run build
      - run: npm test
      - run: node --test tests/*.test.mjs
      - name: Install isolated Redis acceptance dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Verify cross-instance support quotas without external delivery
        run: node --test tests/contact-budget.integration.mjs
      - run: npm run lint
