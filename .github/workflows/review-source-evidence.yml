name: Review source evidence
on:
  pull_request:
    paths:
      - '.github/workflows/review-source-evidence.yml'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 31
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Capture the public Chromium binary for pixel QA
        run: |
          mkdir -p /tmp/gys-browser-evidence
          git rev-parse HEAD > /tmp/gys-browser-evidence/COMMIT.txt
          tar -czf /tmp/gys-browser-evidence/chromium.tar.gz -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-browser-${{ github.event.pull_request.head.sha }}
          path: /tmp/gys-browser-evidence/*
          retention-days: 1
          compression-level: 0
