<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GetYourSats phone display review · disposable UI fixtures</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ddd7cc;color:#28241f;font:14px system-ui,sans-serif}header{padding:12px 20px;background:#fff8ec;position:sticky;top:0;z-index:2;border-bottom:1px solid #c4b69e}h1{font-size:18px;margin:0 0 6px}p{margin:0 0 10px}nav{display:flex;gap:12px;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}select{padding:8px;border:1px solid #b5a58b;border-radius:6px;background:white}main{padding:16px;overflow:auto}iframe{display:block;margin:auto;border:0;outline:1px solid #9c8a6e;background:#fff;width:390px;height:844px}
  </style>
</head>
<body>
  <header>
    <h1>GetYourSats phone display review</h1>
    <p>Disposable UI fixtures. Balances, quotes and payment responses are simulated. No wallet keys or real payments.</p>
    <nav aria-label="Review controls">
      <label>Review language <select id="review-language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="es">Español</option><option value="pt">Português</option><option value="ja">日本語</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="ta">தமிழ்</option><option value="ar">العربية</option><option value="zh-CN">简体中文</option></select></label>
      <label>Journey <select id="review-journey"><option value="confirm">Fixed invoice review</option><option value="amount">Amount entry</option><option value="market">Market</option><option value="receive-personal">Receive: personal address</option><option value="receive-anonymous">Receive: default address</option><option value="received">Received splash</option><option value="receiving">Receive processing</option><option value="converting">Conversion processing</option><option value="sending">Payment processing</option><option value="sent">Payment result</option><option value="failed">Payment failure</option></select></label>
      <label>Viewport <select id="review-width"><option value="320">320 × 568</option><option value="360">360 × 640</option><option value="390">390 × 844</option><option value="768">768 × 1024</option><option value="1366">1366 × 900</option></select></label>
      <label>Text size <select id="review-scale"><option>100</option><option>150</option><option>200</option></select>%</label>
      <label>Currency <select id="review-currency"><option>INR</option><option>USD</option></select></label>
      <label>Rate <select id="review-rate"><option value="available">Available (simulated)</option><option value="missing">Unavailable</option></select></label>
    </nav>
  </header>
  <main><iframe id="review-frame" title="GetYourSats disposable wallet interface"></iframe></main>
  <script type="module">
    // Development-only entry. The production build never imports these fixtures.
    const language=document.querySelector('#review-language');
    const journey=document.querySelector('#review-journey');
    const width=document.querySelector('#review-width');
    const frame=document.querySelector('#review-frame');
    const scale=document.querySelector('#review-scale');
    const currency=document.querySelector('#review-currency');
    const rate=document.querySelector('#review-rate');
    function render(){
      frame.width=width.value;
      frame.style.width=`${width.value}px`;
      frame.height=width.value==='320'?'568':width.value==='360'?'640':width.value==='768'?'1024':width.value==='1366'?'900':'844';
      frame.style.height=`${frame.height}px`;
      const url=new URL('android-payment-fixture.html',location.href);
      url.searchParams.set('lang',language.value);
      url.searchParams.set('screen',journey.value);
      url.searchParams.set('scale',scale.value);
      url.searchParams.set('currency',currency.value);
      url.searchParams.set('rate',rate.value);
      frame.src=url.href;
    }
    language.addEventListener('change',render);
    journey.addEventListener('change',render);
    for(const control of [width,scale,currency,rate])control.addEventListener('change',render);
    render();
  </script>
</body>
</html>
